<title>트립포켓 화면 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 시안 설명 헤더 + 휴대폰 프레임(360 비율) 그리드. 프레임 내부는 docs/11 디자인 토큰(A안 바다 블루)을 그대로 사용 */
:root {
  --primary: #2F6BFF;
  --primary-weak: #EAF0FF;
  --bg: #FFFFFF;
  --bg-subtle: #F4F6F9;
  --surface: #FFFFFF;
  --border: #E5E8EE;
  --text: #191F28;
  --text-sub: #4E5968;
  --text-muted: #8B95A1;
  --success: #16A34A;
  --warning: #F59E0B;
  --danger: #EF4444;
  --rating: #E9A800;
  --canvas: #E9EDF3;
  --map-land: #EEF1EA;
  --map-water: #CFE0F5;
  --map-road: #FFFFFF;
  --frame: #191F28;
  --d1: #2F6BFF; --d2: #FF6B4A; --d3: #12B5A5;
  --font: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #5B8CFF; --primary-weak: #1B2747; --bg: #0F1115; --bg-subtle: #171A21; --surface: #1D2129;
    --border: #2A2F3A; --text: #F2F4F7; --text-sub: #B0B8C4; --text-muted: #7D8794; --success: #4ADE80;
    --warning: #FBBF24; --danger: #F87171; --rating: #FFC933; --canvas: #08090C;
    --map-land: #1E232B; --map-water: #18304F; --map-road: #2C333E; --frame: #3A404C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: #5B8CFF; --primary-weak: #1B2747; --bg: #0F1115; --bg-subtle: #171A21; --surface: #1D2129;
  --border: #2A2F3A; --text: #F2F4F7; --text-sub: #B0B8C4; --text-muted: #7D8794; --success: #4ADE80;
  --warning: #FBBF24; --danger: #F87171; --rating: #FFC933; --canvas: #08090C;
  --map-land: #1E232B; --map-water: #18304F; --map-road: #2C333E; --frame: #3A404C; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--canvas); color: var(--text); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  word-break: keep-all; overflow-wrap: anywhere;
}
.intro { max-width: 1120px; margin: 0 auto 28px; display: grid; gap: 10px; }
.intro h1 { font-size: 1.75rem; line-height: 1.3; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.intro p { margin: 0; color: var(--text-sub); max-width: 62ch; line-height: 1.6; font-size: 0.95rem; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.legend span { font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text-sub); }

.board { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 36px 24px; justify-items: center; }
figure { margin: 0; display: grid; gap: 12px; width: 100%; max-width: 320px; }
figcaption { display: grid; gap: 2px; }
figcaption b { font-size: 0.95rem; }
figcaption small { color: var(--text-muted); font-size: 0.8rem; line-height: 1.45; }
.sid { font-variant-numeric: tabular-nums; color: var(--primary); font-weight: 700; margin-right: 6px; }

/* ---------- phone frame ---------- */
.phone {
  width: 100%; aspect-ratio: 360 / 740; max-width: 100%; border-radius: 34px; border: 8px solid var(--frame);
  background: var(--bg); overflow: hidden; position: relative; display: flex; flex-direction: column;
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
  font-size: 13px;
}
.status { height: 26px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 11px; font-weight: 600; color: var(--text); }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; min-height: 0; overflow: hidden; }
.hdr { display: flex; align-items: center; gap: 8px; padding: 6px 14px 8px; }
.hdr .t { flex: 1; min-width: 0; }
.hdr .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .t small { color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.ib { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--text-sub); flex: none; }
.ib svg { width: 18px; height: 18px; }
.ib.bolt { background: var(--primary-weak); color: var(--primary); }
.h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; padding: 4px 16px 10px; margin: 0; }

.tabbar { flex: none; height: 54px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); }
.tabbar div { display: grid; place-items: center; align-content: center; gap: 2px; font-size: 10px; color: var(--text-muted); }
.tabbar div.on { color: var(--primary); font-weight: 700; }
.tabbar svg { width: 19px; height: 19px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
.pad { padding: 0 14px; display: grid; gap: 10px; }
.label { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.02em; }
.btn { height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 12.5px; padding: 0 12px; border: 0; font-family: inherit; }
.btn.pri { background: var(--primary); color: #fff; }
.btn.sec { background: var(--bg-subtle); color: var(--text); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); font-size: 11.5px; color: var(--text-sub); white-space: nowrap; background: var(--surface); }
.chip.on { background: var(--primary-weak); border-color: transparent; color: var(--primary); font-weight: 700; }
.chips { display: flex; gap: 6px; overflow: hidden; padding: 0 14px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.num { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.sub { color: var(--text-sub); }
.tab { font-variant-numeric: tabular-nums; }

/* 홈 */
.next { padding: 14px; display: grid; gap: 8px; background: var(--primary); color: #fff; border: 0; }
.next small { opacity: .85; font-size: 11px; }
.next b { font-size: 17px; }
.next .row { display: flex; gap: 6px; }
.next .btn { background: rgba(255,255,255,.18); color: #fff; height: 32px; }
.list { display: grid; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.li:last-child { border-bottom: 0; }
.li .tm { width: 40px; font-variant-numeric: tabular-nums; color: var(--text-sub); font-size: 12px; }
.li .nm { flex: 1; min-width: 0; font-weight: 600; }
.chk { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); flex: none; }
.chk.done { background: var(--success); border-color: var(--success); }
.done-t { color: var(--text-muted); text-decoration: line-through; font-weight: 500 !important; }
.lodge { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg-subtle); border-radius: 12px; font-size: 12px; }
.lodge b { flex: 1; min-width: 0; }
.copy { color: var(--primary); font-weight: 700; font-size: 11.5px; }

/* 일정 */
.map { position: relative; height: 38%; flex: none; background: var(--map-land); overflow: hidden; }
.map svg { width: 100%; height: 100%; display: block; }
.sheet { flex: 1; min-height: 0; margin-top: -14px; background: var(--bg); border-radius: 18px 18px 0 0; position: relative; display: flex; flex-direction: column; box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
.grab { width: 36px; height: 4px; border-radius: 4px; background: var(--border); margin: 7px auto 8px; flex: none; }
.dayhdr { display: flex; align-items: baseline; justify-content: space-between; padding: 8px 14px 4px; }
.dayhdr b { font-size: 14px; }
.it { display: flex; gap: 10px; padding: 7px 14px; align-items: flex-start; }
.it .tm { width: 36px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-sub); padding-top: 3px; }
.it .body { flex: 1; min-width: 0; display: grid; gap: 1px; }
.it .body b { font-size: 13px; }
.it .body small { color: var(--text-muted); font-size: 11px; }
.kind { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: var(--bg-subtle); color: var(--text-sub); align-self: center; }
.gap { margin-left: 61px; padding: 0 14px 0 10px; border-left: 2px dotted var(--border); font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; }
.gap a { color: var(--primary); font-weight: 600; text-decoration: none; }
.add { margin: 4px 14px; height: 34px; border: 1px dashed var(--border); border-radius: 10px; display: grid; place-items: center; color: var(--text-sub); font-size: 12px; font-weight: 600; }

/* 장소 */
.search { margin: 0 14px; height: 40px; border-radius: 12px; background: var(--bg-subtle); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--text-muted); }
.search svg { width: 16px; height: 16px; }
.place { display: grid; gap: 4px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.place .top { display: flex; justify-content: space-between; gap: 8px; }
.place b { font-size: 13.5px; }
.stars { color: var(--rating); font-weight: 700; font-variant-numeric: tabular-nums; }
.meta { font-size: 11.5px; color: var(--text-sub); display: flex; gap: 6px; flex-wrap: wrap; }
.open { color: var(--success); font-weight: 600; }
.acts { display: flex; gap: 6px; margin-top: 3px; }
.acts .btn { height: 30px; font-size: 11.5px; }
.powered { text-align: right; font-size: 10px; color: var(--text-muted); padding: 6px 14px; }

/* 빠른 메뉴 */
.dim { position: absolute; inset: 0; background: rgba(10, 14, 22, .45); }
.qsheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 20px 20px 0 0; padding: 0 14px 14px; display: grid; gap: 9px; }
.fx.ai { background: var(--primary-weak); }
.fx.ai b { font-size: 14px; }
.fx { padding: 10px 12px; }
.fx { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--bg-subtle); border-radius: 14px; }
.fx .v { flex: 1; display: grid; gap: 2px; }
.fx .v b { font-size: 16px; font-variant-numeric: tabular-nums; }
.fx .v small { font-size: 10.5px; color: var(--text-muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sc { display: flex; align-items: center; gap: 8px; height: 44px; border-radius: 12px; background: var(--bg-subtle); padding: 0 10px; font-size: 12px; font-weight: 600; }
.sc svg { width: 16px; height: 16px; color: var(--primary); flex: none; }
.qrow { display: grid; gap: 6px; }
.qrow span { font-size: 11.5px; color: var(--text-sub); font-weight: 600; }
.more { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px 0; border-top: 1px solid var(--border); font-weight: 600; font-size: 12.5px; }

/* 세그먼트 · 스위치 · 스테퍼 · 슬라이더 (실제 동작) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg-subtle); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; height: 30px; border-radius: 8px; font: inherit; font-size: 11.5px; color: var(--text-sub); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.sw { width: 42px; height: 25px; border-radius: 999px; background: var(--border); position: relative; border: 0; cursor: pointer; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sw[aria-checked="true"] { background: var(--primary); }
.sw[aria-checked="true"]::after { transform: translateX(17px); }
.stp { display: flex; align-items: center; gap: 4px; }
.stp button { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 15px; cursor: pointer; }
.stp button:disabled { opacity: .35; cursor: default; }
.stp output { min-width: 42px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.setgrp { display: grid; gap: 0; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.setrow:last-child { border-bottom: 0; }
.setcol { display: grid; gap: 7px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.setcol .lab { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; }
.setcol .lab output { color: var(--primary); font-variant-numeric: tabular-nums; }
.radio { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 12.5px; cursor: pointer; border: 0; background: transparent; width: 100%; font-family: inherit; color: var(--text); text-align: left; }
.radio .logo { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; }
.radio .r { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); }
.radio[aria-checked="true"] .r { border: 6px solid var(--primary); }
input[type=range] { width: 100%; accent-color: var(--primary); }
.preview { font-size: 12px; color: var(--text-sub); background: var(--bg-subtle); border-radius: 8px; padding: 6px 9px; }
.grptitle { font-size: 11px; color: var(--text-muted); font-weight: 700; padding: 10px 2px 6px; }

/* 환율 계산기 */
.cur { display: grid; gap: 5px; }
.cur .name { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-sub); font-weight: 600; }
.amt { height: 50px; border-radius: 12px; background: var(--bg-subtle); display: flex; align-items: center; justify-content: flex-end; padding: 0 14px; font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; border: 2px solid transparent; }
.amt.active { border-color: var(--primary); background: var(--surface); }
.swap { justify-self: center; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-sub); background: var(--surface); cursor: pointer; }
.qa { display: flex; gap: 6px; flex-wrap: wrap; }
.qa button { cursor: pointer; font-family: inherit; }
.rate { display: grid; gap: 2px; font-size: 12px; }
.rate small { color: var(--text-muted); font-size: 10.5px; }
.naver { font-size: 11.5px; color: var(--primary); font-weight: 600; text-decoration: none; }
.pad3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
.pad3 button { height: 42px; border-radius: 10px; border: 0; background: var(--bg-subtle); color: var(--text); font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.pad3 button:active { background: var(--primary-weak); }
.example { position: absolute; top: 8px; right: 10px; font-size: 9.5px; padding: 2px 7px; border-radius: 999px; background: var(--warning); color: #191F28; font-weight: 700; z-index: 2; }

button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .sw::after { transition: none; } }
@media (max-width: 420px) { .intro h1 { font-size: 1.45rem; } }
</style>

              <div class="seg" role="radiogroup" aria-label="테마" data-group="s-theme">
                <button type="button" role="radio" aria-checked="false" id="s-theme-light">라이트</button>
                <button type="button" role="radio" aria-checked="false" id="s-theme-dark">다크</button>
                <button type="button" role="radio" aria-checked="true" id="s-theme-system">시스템</button>
              </div>
            </div>
            <div class="setcol"><div class="lab">글자 크기 <output id="font-out">보통</output></div>
              <input type="range" id="font-range" min="0" max="3" step="1" value="1" aria-label="글자 크기">
              <div class="preview" id="font-prev">2일차 · 센소지 09:00</div>
            </div>
            <div class="setcol"><div class="lab">시간 표기</div>
              <div class="seg" role="radiogroup" aria-label="시간 표기" data-group="s-time">
                <button type="button" role="radio" aria-checked="true" id="s-time-24">24시간 09:00</button>
                <button type="button" role="radio" aria-checked="false" id="s-time-12">오전 9:00</button>
              </div>
            </div>
            <div class="setrow"><span style="font-weight:600;font-size:12.5px">진동</span><button type="button" class="sw" role="switch" aria-checked="true" aria-label="진동" id="s-haptic"></button></div>
          </div>
          <div class="grptitle">지도·길찾기</div>
          <div class="card setgrp" role="radiogroup" aria-label="기본 길찾기 앱" data-group="s-app">
            <button type="button" class="radio" role="radio" aria-checked="true" id="s-app-naver"><span class="logo" style="background:#03C75A">N</span>네이버 지도<span class="r"></span></button>
            <button type="button" class="radio" role="radio" aria-checked="false" id="s-app-google"><span class="logo" style="background:#4285F4">G</span>Google 지도<span class="r"></span></button>
            <button type="button" class="radio" role="radio" aria-checked="false" id="s-app-kakao"><span class="logo" style="background:#FEE500;color:#191F28">K</span>카카오맵<span class="r"></span></button>
            <button type="button" class="radio" role="radio" aria-checked="false" id="s-app-ask"><span class="logo" style="background:var(--text-muted)">?</span>매번 묻기<span class="r"></span></button>
          </div>
          <div class="grptitle">장소 찾기</div>
          <div class="card setgrp">
            <div class="setcol"><div class="lab">기본 검색 반경 <output id="rad-out">3km</output></div>
              <input type="range" id="rad-range" min="0.5" max="20" step="0.5" value="3" aria-label="기본 검색 반경">
            </div>
          </div>
          <div class="grptitle">데이터</div>
          <div class="card setgrp" style="margin-bottom:14px">
            <div class="setrow"><span style="font-weight:600;font-size:12.5px">백업 알림 주기</span>
              <div class="stp"><button type="button" id="bk-minus" aria-label="줄이기">−</button><output id="bk-out">14일</output><button type="button" id="bk-plus" aria-label="늘리기">+</button></div>
            </div>
            <div class="setrow"><span style="font-weight:600;font-size:12.5px">자동 동기화</span><button type="button" class="sw" role="switch" aria-checked="true" aria-label="자동 동기화" id="s-sync"></button></div>
          </div>
        </div>
      </div>
    </div>
    <figcaption><b><span class="sid">S-23</span>설정 · 컨트롤 원칙</b><small>선택지 2~4개는 세그먼트, 켜기/끄기는 스위치, 5개 이상은 라디오 목록, 범위는 슬라이더, 간격 있는 숫자는 스테퍼를 씁니다. 모두 즉시 적용돼요.</small></figcaption>
  </figure>
</main>

<script>
(function () {
  // 세그먼트 · 라디오 그룹: 같은 그룹 안에서 하나만 선택
  document.querySelectorAll('[data-group]').forEach(function (group) {
    group.addEventListener('click', function (e) {
      var btn = e.target.closest('[role="radio"]');
      if (!btn || !group.contains(btn)) return;
      group.querySelectorAll('[role="radio"]').forEach(function (b) { b.setAttribute('aria-checked', String(b === btn)); });
    });
  });
  // 스위치
  document.querySelectorAll('.sw').forEach(function (sw) {
    sw.addEventListener('click', function () { sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true')); });
  });
  // 글자 크기 슬라이더 (4단계)
  var fontNames = ['작게', '보통', '크게', '아주 크게'], fontScale = [0.9, 1, 1.15, 1.3];
  var fr = document.getElementById('font-range');
  fr.addEventListener('input', function () {
    document.getElementById('font-out').textContent = fontNames[fr.value];
    document.getElementById('font-prev').style.fontSize = (12 * fontScale[fr.value]) + 'px';
  });
  // 검색 반경 슬라이더
  var rr = document.getElementById('rad-range');
  rr.addEventListener('input', function () { document.getElementById('rad-out').textContent = (+rr.value) + 'km'; });
  // 백업 알림 스테퍼: 끄기, 7~56일 (7일 단위)
  var bk = 14, out = document.getElementById('bk-out'), minus = document.getElementById('bk-minus'), plus = document.getElementById('bk-plus');
  function renderBk() { out.textContent = bk === 0 ? '끄기' : bk + '일'; minus.disabled = bk === 0; plus.disabled = bk === 56; }
  minus.addEventListener('click', function () { bk = Math.max(0, bk - 7); renderBk(); });
  plus.addEventListener('click', function () { bk = Math.min(56, bk + 7); renderBk(); });
  renderBk();

  // 환율 계산기 (예시 환율: 100엔 = 912.34원)
  var perYen = 9.1234, digits = '3500', yenToWon = true;
  var fromEl = document.getElementById('fx-from'), toEl = document.getElementById('fx-to');
  var fromName = document.getElementById('fx-from-name'), toName = document.getElementById('fx-to-name');
  var quick = document.getElementById('fx-quick');
  var fmt = new Intl.NumberFormat('ko-KR');
  function renderQuick() {
    var list = yenToWon ? [1000, 5000, 10000, 50000] : [10000, 50000, 100000, 500000];
    quick.innerHTML = '';
    list.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.textContent = yenToWon ? '¥' + fmt.format(v) : fmt.format(v) + '원';
      b.addEventListener('click', function () { digits = String(v); render(); });
      quick.appendChild(b);
    });
  }
  function render() {
    var n = +digits || 0;
    if (yenToWon) {
      fromEl.textContent = '¥ ' + fmt.format(n);
      toEl.textContent = fmt.format(Math.round(n * perYen)) + '원';
    } else {
      fromEl.textContent = fmt.format(n) + '원';
      toEl.textContent = '¥ ' + fmt.format(Math.round(n / perYen));
    }
  }
  document.getElementById('fx-pad').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var k = b.textContent;
    if (k === '⌫') digits = digits.slice(0, -1);
    else if (digits.length < 9) digits = (digits === '0' ? '' : digits) + k;
    digits = digits.replace(/^0+(?=\d)/, '');
    render();
  });
  document.getElementById('fx-swap').addEventListener('click', function () {
    yenToWon = !yenToWon;
    var a = fromName.textContent.replace(' ▾', ''), c = toName.textContent.replace(' ▾', '');
    fromName.textContent = c + ' ▾'; toName.textContent = a;
    digits = yenToWon ? '3500' : '30000';
    renderQuick(); render();
  });
  renderQuick(); render();
})();
</script>
