# 푸시·PR마다 검사 (docs/15 12단계). 배포는 Cloudflare Pages가 GitHub 저장소를 직접 빌드한다 (docs/deploy.md)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 단계를 나누고, 실패하면 마지막 오류 줄을 주석으로 남긴다 (로그인 없이 원인 확인, scripts/ci-step.sh)
      - name: Format
        run: bash scripts/ci-step.sh format pnpm format:check
      - name: Lint
        run: bash scripts/ci-step.sh lint pnpm lint
      - name: Typecheck
        run: bash scripts/ci-step.sh typecheck pnpm typecheck
      - name: Unit tests
        run: bash scripts/ci-step.sh test pnpm test
      - name: Build + first-load size (budget 300KB)
        run: bash scripts/ci-step.sh size pnpm --filter @trippocket/web size
      - name: E2E (Playwright, Chromium)
        run: |
          pnpm --filter @trippocket/web exec playwright install --with-deps chromium
          bash scripts/ci-step.sh e2e pnpm e2e
        env:
          CI: true
          # 시험 코드(Node)도 브라우저(playwright.config timezoneId)와 같은 한국 시간으로
          TZ: Asia/Seoul
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
