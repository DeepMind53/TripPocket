# 푸시·PR마다 검사 (docs/15 12단계). 배포는 Cloudflare Pages가 GitHub 저장소를 직접 빌드한다 (docs/deploy.md)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - name: Build + first-load size (budget 200KB)
        run: pnpm --filter @trippocket/web size
      - name: E2E (Playwright, Chromium)
        run: |
          pnpm --filter @trippocket/web exec playwright install --with-deps chromium
          pnpm e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
